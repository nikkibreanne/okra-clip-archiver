[package]
name = "okra-clip-archiver"
version = "0.4.0"
edition = "2021"
description = "Pull a Twitch stream's clips and cut local 4K verticals for Shorts/TikTok"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dotenvy = "0.15"
axum = "0.7"
open = "5"
rust-embed = "8"
mime_guess = "2"
