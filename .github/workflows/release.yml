name: release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) → build the
# self-contained Windows app (UI embedded, ffmpeg bundled) and publish a zip + an
# installer to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the React UI (embedded into the exe)
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - uses: dtolnay/rust-toolchain@stable
      - name: Install NASM (needed to build aws-lc-rs / rustls on Windows)
        uses: ilammy/setup-nasm@v1
      - name: Build release exe
        # The Twitch client ID is a PUBLIC identifier (it appears in every OAuth
        # URL); baking it in is what makes one-click "Sign in with Twitch" work.
        # No client secret is involved — the app uses the device code flow.
        env:
          OKRA_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: cargo build --release --locked

      - name: Fetch static ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_src -Force
          $ff  = Get-ChildItem -Recurse ffmpeg_src -Filter ffmpeg.exe | Select-Object -First 1
          $lic = Get-ChildItem -Recurse ffmpeg_src -Filter LICENSE* | Select-Object -First 1
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item $ff.FullName  staging\ffmpeg.exe
          Copy-Item $lic.FullName staging\FFMPEG-LICENSE.txt

      - name: Stage app files + zip
        shell: pwsh
        run: |
          Copy-Item target\release\okra-clip-archiver.exe staging\
          Copy-Item README.md      staging\
          Copy-Item .env.example   staging\
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path staging\* -DestinationPath "dist\okra-clip-archiver-${{ github.ref_name }}-windows.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ github.ref_name }} installer.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/okra-clip-archiver-*-windows.zip
            dist/okra-clip-archiver-setup.exe
          body: |
            **okra-clip-archiver ${{ github.ref_name }}** (Windows x64) — self-contained.

            - **Installer:** `okra-clip-archiver-setup.exe` (bundles ffmpeg; adds a Start-Menu/desktop shortcut).
            - **Portable:** the `-windows.zip` (unzip and run `okra-clip-archiver.exe serve`).

            Launch it and the portal opens in your browser. Everything is configured on the
            **Settings** tab — Twitch app + source channel, recordings/output folders,
            render quality, and the YouTube/TikTok upload targets. No file editing needed;
            settings are saved per-user so no admin rights are required.

            ffmpeg is bundled under GPL (`FFMPEG-LICENSE.txt`); the app itself is MIT.
