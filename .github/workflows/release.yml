name: release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) → this
# builds the Windows .exe on a Windows runner and attaches it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NASM (needed to build aws-lc-rs / rustls on Windows)
        uses: ilammy/setup-nasm@v1
      - name: Build release
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/okra-clip-archiver.exe
          body: |
            **okra-clip-archiver ${{ github.ref_name }}** (Windows x64).

            Requires **ffmpeg** on PATH (or drop `ffmpeg.exe` next to this tool).

            ```
            okra-clip-archiver.exe --channel <login> --recordings "C:\path\to\obs\videos" --run
            ```
            Config via flags or a `.env` next to the exe: `TWITCH_CLIENT_ID`,
            `TWITCH_CLIENT_SECRET`, `TWITCH_CHANNEL`, `RECORDINGS_DIR`.
